<style>
:root{color-scheme:light;--paper:#f7f5ed;--ink:#244c50;--muted:#7b8d87;--line:#dce2d7;--accent:#e77850}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;transition:background .7s,color .7s}button,input{font:inherit}button{cursor:pointer}main{max-width:1300px;margin:auto;padding:34px 44px 22px}.masthead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:21px}.brand{font-size:13px;font-weight:700;letter-spacing:2.5px;display:flex;align-items:center;gap:11px}.brand svg{width:29px;height:29px}.issue{font-size:11px;letter-spacing:2px;color:var(--muted)}.intro{display:flex;align-items:end;justify-content:space-between;margin:31px 0 25px}.eyebrow{font-size:11px;color:var(--accent);letter-spacing:3px;margin:0 0 10px}h1{font-size:clamp(28px,4vw,43px);font-weight:500;letter-spacing:2px;margin:0}h1 span{font-family:Georgia,serif;font-style:italic;font-weight:400}.description{color:var(--muted);font-size:13px;line-height:1.9;margin:0 0 2px;letter-spacing:1px}.scene{position:relative;border:1px solid #d7e2d7;border-radius:18px;overflow:hidden;background:#e5eee3;box-shadow:0 12px 34px #36594c06}.scene>svg{display:block;width:100%;height:auto}.tag{position:absolute;left:26px;top:25px;display:flex;align-items:center;gap:9px;font-size:10px;letter-spacing:2px;color:#547975}.dot{height:6px;width:6px;background:#e78254;border-radius:50%;box-shadow:0 0 0 4px #e7825415}.scene-label{position:absolute;right:26px;bottom:23px;font-family:Georgia,serif;font-style:italic;color:#577f79;font-size:15px}.controls{display:flex;align-items:center;gap:25px;padding:21px 2px}.play{border:0;border-radius:50%;width:48px;height:48px;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex-shrink:0}.play svg{width:18px;height:18px}.ride-status{min-width:128px}.ride-status strong{font-size:13px;font-weight:500;display:block;margin-bottom:5px}.ride-status small{font-size:10px;letter-spacing:1px;color:var(--muted)}.divider{height:29px;width:1px;background:var(--line)}.speed{display:flex;gap:15px;align-items:center;font-size:11px;letter-spacing:1px}.speed input{width:128px;accent-color:#de8059;cursor:pointer}.speed output{width:35px;color:var(--muted);font-variant-numeric:tabular-nums}.theme{margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--ink);padding:11px 16px;border-radius:24px;font-size:12px;display:flex;align-items:center;gap:8px}.theme svg{width:16px;height:16px}.footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:17px;color:var(--muted);font-size:10px;letter-spacing:1.8px}.footer span:last-child{letter-spacing:1px}.sky{fill:#e6eee3;transition:fill 1s}.sea{fill:#b6d9d0;transition:fill 1s}.hill{fill:#8abeb1;transition:fill 1s}.dune{fill:#dbe4c8;transition:fill 1s}.sand{fill:#eee8cc;transition:fill 1s}.road{fill:#e0dbbd;transition:fill 1s}.cloud{fill:#f7f8eb;opacity:.85;transition:opacity 1s}.stars{opacity:0;transition:opacity 1s}.sun{fill:#eab77d;transition:fill 1s}.night{--paper:#172e38;--ink:#e4eada;--muted:#91aca9;--line:#36515a;--accent:#e9aa7b;color-scheme:dark}.night .scene{border-color:#3d5961}.night .sky{fill:#233f50}.night .sea{fill:#3f737b}.night .hill{fill:#35656b}.night .dune{fill:#607f72}.night .sand{fill:#899180}.night .road{fill:#707e72}.night .cloud{opacity:.15}.night .sun{fill:#faf0c5}.night .stars{opacity:1}.night .tag,.night .scene-label{color:#c0d2c7}.night .theme{color:#e4eada}button:focus-visible,input:focus-visible{outline:3px solid #de8059;outline-offset:4px}button:hover{filter:brightness(1.12)}
@media(max-width:700px){main{padding:20px 16px}.issue{letter-spacing:1px;font-size:9px}.brand{font-size:10px;letter-spacing:1px}.intro{margin:25px 0 20px;display:block}.description{margin-top:12px;font-size:12px}.description br{display:none}.scene>svg{width:150%;max-width:none;margin-left:-25%}.tag{left:16px;top:16px;font-size:8px}.scene-label{font-size:11px;right:16px;bottom:16px}.controls{gap:13px;flex-wrap:wrap}.ride-status{min-width:100px}.divider{display:none}.speed{margin-left:auto;gap:8px}.speed input{width:78px}.theme{margin-left:0;padding:8px 12px}.footer{font-size:8px;letter-spacing:1px;gap:12px}.footer span:last-child{text-align:right}}

<body>
<main>
 <header class="masthead"><div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="14" stroke="currentColor"/><path d="M6 20q5-6 10 0t10 0M6 15q5-6 10 0t10 0" stroke="currentColor"/></svg>COASTAL CLUB / 海岸俱乐部</div><span class="issue">A LITTLE RIDE · NO. 001</span></header>
 <section class="intro"><div><p class="eyebrow">慢一点，海风会等你</p><h1>鹈鹕的海岸骑行 <span>À vélo.</span></h1></div><p class="description">把烦恼留在身后，把海风装进口袋。<br>今天也适合，漫无目的地快乐。</p></section>

 <path class="road" d="M0 507q270-9 600 0t600 0v76q-350-9-600 0t-600 0Z"/>
 <path d="M0 509h1200v73H0z" fill="url(#roadLines)"/>
 <g id="verge"><use href="#grass" x="60" y="472"/><use href="#grass" x="342" y="460" transform="rotate(-10 342 460)"/><use href="#grass" x="945" y="463"/><use href="#grass" x="1140" y="480"/><g fill="#b5bea0"><ellipse cx="242" cy="592" rx="9" ry="3"/><ellipse cx="915" cy="488" rx="7" ry="2"/><ellipse cx="1090" cy="596" rx="13" ry="4"/></g><use href="#grass" x="165" y="610"/><use href="#grass" x="1015" y="618" transform="rotate(16 1015 618)"/></g>

  <g fill="none" stroke="#f4efd8" stroke-width="2"><circle cx="466" cy="466" r="69"/><circle cx="756" cy="466" r="69"/></g>
  <g id="backWheel" transform="translate(466 466)"><use href="#spokes"/></g><g id="frontWheel" transform="translate(756 466)"><use href="#spokes"/></g>
  <path d="M390 442a80 80 0 0 1 151-13M682 431a80 80 0 0 1 147 7" fill="none" stroke="#72aaa4" stroke-width="5" stroke-linecap="round"/>
  <path d="M466 466l89-135 47 135H466l112-103h141L602 466m117-103 37 103m-201-135-9-29m173 61-15-46" fill="none" stroke="#388d91" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="m704 317-10-30q-2-10 12-10h29" fill="none" stroke="#315b5c" stroke-width="7" stroke-linecap="round"/>
  <path d="M725 277h24" stroke="#c58a62" stroke-width="10" stroke-linecap="round"/>
  <path d="M526 301q23-10 48-2l4 7h-52Z" fill="#32575a"/>
  <g fill="#315b5c"><circle cx="466" cy="466" r="7"/><circle cx="756" cy="466" r="7"/></g>
  <path d="M466 466h136" stroke="#345e60" stroke-width="2"/><circle cx="602" cy="466" r="19" fill="#f0e5c9" stroke="#305c60" stroke-width="4"/>
  <path id="farLeg" d="M568 321 615 378 574 461" fill="none" stroke="#ba834c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- A rounded, unmistakably long-billed pelican -->
  <g id="bird">
   <path d="M522 264q-37 13-60-5 4 28 42 33" fill="#e5e7d8" stroke="#395f5b" stroke-width="3" stroke-linejoin="round"/>
   <path d="M509 262c-6 38 17 64 55 65 47 0 83-40 91-80l-32-34c-34 1-52 21-61 31-18 7-32 10-53 18Z" fill="#faf8e9" stroke="#395f5b" stroke-width="3"/>
   <path d="M590 267c-7-21 10-49 21-69 11-18 7-43 13-61 8-23 33-34 54-22 22 12 27 38 12 54-17 17-30 20-29 43 1 23-4 46-22 61" fill="#faf8e9" stroke="#395f5b" stroke-width="3"/>
   <path d="M632 165q-1 33-17 57" fill="none" stroke="#e6e6d6" stroke-width="9" stroke-linecap="round"/>
   <path d="M680 147q56 4 117 24c-22 20-56 41-83 30-17-7-28-30-34-54Z" fill="#eab16c" stroke="#916c47" stroke-width="2.5" stroke-linejoin="round"/>
   <path d="m679 141 129 25q7 2-1 6l-128-10" fill="#efbc70" stroke="#916c47" stroke-width="2.5" stroke-linejoin="round"/>
   <path d="m690 159 96 10" stroke="#ffd797" stroke-width="2" stroke-linecap="round"/>
   <circle cx="671" cy="136" r="5" fill="#284a4a"/><circle cx="672" cy="134.5" r="1.5" fill="#fff"/>
   <path d="M642 112q-6-10-15-9m23 6q0-11-7-16" stroke="#395f5b" stroke-width="3" fill="none" stroke-linecap="round"/>
   <path d="M622 206q17 12 37 11l-3 16q-23 0-42-14Z" fill="#db744e" stroke="#b96243" stroke-width="2"/>
   <path id="scarf" d="M621 216C590 204 571 220 542 205l6 17-13 9c34 7 54-11 82 0Z" fill="#e68359" stroke="#bb6445" stroke-width="2" stroke-linejoin="round"/>
   <path d="M554 217h13m12 2 13-1" stroke="#f7bd8c" stroke-width="3" stroke-linecap="round"/>
   <path d="M547 270c8-26 39-33 58-13 18 17 43 29 73 17l29-4c6 0 12 4 9 9-21 22-76 31-108 17-24 13-51 5-61-26Z" fill="#efefdf" stroke="#395f5b" stroke-width="3" stroke-linejoin="round"/>
   <path d="M565 271q18 12 34 10m-29-1q13 12 30 10" stroke="#b9cbc0" fill="none" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <path id="nearLeg" d="M574 318 572 393 630 471" fill="none" stroke="#d79c57" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="farFoot" fill="#ca9254" stroke="#8a6c43" stroke-width="2" stroke-linejoin="round"/>
  <g id="crank" transform="translate(602 466)"><path d="M-29 0h58" stroke="#305c60" stroke-width="5" stroke-linecap="round"/><circle r="6" fill="#305c60"/></g>
  <path id="nearFoot" fill="#e9af64" stroke="#8a6c43" stroke-width="2" stroke-linejoin="round"/>
  <path id="pedalNear" stroke="#305c60" stroke-width="6" stroke-linecap="round"/><path id="pedalFar" stroke="#305c60" stroke-width="6" stroke-linecap="round"/>
 </g>
 <g fill="none" stroke="#71978c" stroke-width="2" stroke-linecap="round" opacity=".6" id="wind"><path d="M376 240h46m-65 15h40m-2 69h34"/></g>

 </svg>
 <div class="scene-label">Nowhere to rush. Just ride.</div>
 </section>
 <div class="controls">
  <button class="play" id="play" type="button" aria-label="暂停动画" aria-pressed="false"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path id="playIcon" d="M5 4h3v12H5zm7 0h3v12h-3z"/></svg></button>
  <div class="ride-status"><strong id="status">正在兜风</strong><small>ENJOY THE LITTLE THINGS</small></div><span class="divider"></span>
  <label class="speed" for="speed">骑行速度 <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1" aria-label="骑行速度"><output id="speedValue" for="speed">1.0×</output></label>
  <button class="theme" id="theme" type="button" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15.9 12.1A7 7 0 0 1 7.9 4.1a7 7 0 1 0 8 8Z"/></svg><span id="themeText">切换夜骑</span></button>
 </div>
 <footer class="footer"><span>一只鹈鹕 · 两个轮子 · 无限好心情</span><span>DRAWN WITH SVG · MADE FOR A SLOW DAY</span></footer>
</main>
<script>
(() => {
 const $ = id => document.getElementById(id);
 let running = !matchMedia('(prefers-reduced-motion: reduce)').matches, speed = 1, time = 0, last = null;
 const play = $('play');
 function updatePlay(){ play.setAttribute('aria-pressed', String(!running)); play.setAttribute('aria-label',running?'暂停动画':'播放动画'); $('playIcon').setAttribute('d',running?'M5 4h3v12H5zm7 0h3v12h-3z':'M6 3l11 7-11 7z'); $('status').textContent=running?'正在兜风':'歇一会儿'; }
 play.addEventListener('click',()=>{running=!running;updatePlay()});
 $('speed').addEventListener('input',e=>{speed=Number(e.target.value);$('speedValue').value=speed.toFixed(1)+'×'});
 $('theme').addEventListener('click',()=>{const night=document.body.classList.toggle('night');$('theme').setAttribute('aria-pressed',String(night));$('themeText').textContent=night?'切换日骑':'切换夜骑'});
 document.addEventListener('keydown',e=>{if(e.code==='Space' && e.target===document.body){e.preventDefault();play.click()}});
 function leg(near, angle){
  const px=602+29*Math.cos(angle),py=466+29*Math.sin(angle),hx=near?574:568,hy=318;
  const dx=px-hx,dy=py-hy,d=Math.hypot(dx,dy),a=85,b=105,along=(a*a-b*b+d*d)/(2*d),height=Math.sqrt(Math.max(0,a*a-along*along));
  const kx=hx+along*dx/d+height*dy/d,ky=hy+along*dy/d-height*dx/d;
  $(near?'nearLeg':'farLeg').setAttribute('d',`M${hx} ${hy} Q${kx} ${ky} ${kx} ${ky} L${px} ${py-5}`);
  $(near?'nearFoot':'farFoot').setAttribute('d',`M${px-7} ${py-9}q10 1 18 6l10 5h-31Z`);
  $(near?'pedalNear':'pedalFar').setAttribute('d',`M${px-11} ${py+3}h24`);
 }
 function render(){
  const angle=time*3.8,deg=angle*180/Math.PI,bob=Math.sin(angle*2)*1.2;
  $('backWheel').setAttribute('transform',`translate(466 466) rotate(${deg*1.14})`);
  $('frontWheel').setAttribute('transform',`translate(756 466) rotate(${deg*1.14})`);
  $('crank').setAttribute('transform',`translate(602 466) rotate(${deg})`);
  leg(false,angle+Math.PI);leg(true,angle);
  $('bird').setAttribute('transform',`translate(0 ${bob}) rotate(${Math.sin(angle)*.4} 574 318)`);
  $('scarf').setAttribute('d',`M621 216C590 ${204+Math.sin(time*7)*5} 571 ${220+Math.cos(time*6)*6} 542 ${205+Math.sin(time*6)*6}l6 17-13 9c34 ${7+Math.sin(time*6)*4} 54-11 82 0Z`);
  $('seaLines').setAttribute('patternTransform',`translate(${-time*12%320} 0)`);
  $('roadLines').setAttribute('patternTransform',`translate(${-time*85%300} 0)`);
  $('clouds').setAttribute('transform',`translate(${-time*4%1320} 0)`);
  const shift=time*85%1400;
  $('verge').setAttribute('transform',`translate(${-shift} 0)`);
  vergeCopy.setAttribute('transform',`translate(${1400-shift} 0)`);
  cloudCopy.setAttribute('transform',`translate(${1320-time*4%1320} 0)`);
  $('sailboat').setAttribute('transform',`translate(${175-time*9%1450} ${325+Math.sin(time)*1.5})`);
  $('wind').setAttribute('opacity',String(.35+Math.sin(time*4)*.15));
 }
 const vergeCopy=$('verge').cloneNode(true);vergeCopy.removeAttribute('id');$('verge').after(vergeCopy);
 const cloudCopy=$('clouds').cloneNode(true);cloudCopy.removeAttribute('id');$('clouds').after(cloudCopy);
 function frame(now){if(last!==null && running && !document.hidden)time+=Math.min((now-last)/1000,.05)*speed;last=now;render();requestAnimationFrame(frame)}
 updatePlay();requestAnimationFrame(frame);
})();
</script>
</body>
